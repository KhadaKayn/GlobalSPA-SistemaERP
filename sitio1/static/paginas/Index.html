<!DOCTYPE html>
<html lang="es">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principal</title>
  <link rel="icon" type="image/png" href="../Img/logo.webp">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../estilo/styles.css">

</head>
<body>
  
  <header>
    <div class="ladoizquierdo">
      <div class="menu-container">
        <div class="menu" id="menu">
          <div class=""></div>
          <div class=""></div>
          <div class=""></div>
        </div>
      </div>
      <div class="logo">
        <a href="{% url 'home' %}">
          <img src="{% static 'Img/logo.webp' %}" alt="Logo">
        </a>
        <span> Global SPa</span>
      </div>
    </div>

    <div class="ladoderecho">
      <div class="perfiluser">
        <img src="../Img/gatocorbata.webp" alt="">
        <span>{{ user.username }}</span>
      </div>
      
    </div>
  </header>
  
  <div class="sidebar " id="sidebar">
    <nav>
      <ul>
        <li>
          <a href="" class="selected">
            <img src="../Img/icons/box-svgrepo-com.svg" alt="">
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a href="{% url 'vista_administrador' %}" class="icons-header">
            <img src="../Img/icons/box-svgrepo-com.svg" alt="">
            <span>Productos</span>
          </a>
        </li>
        <li>
          <a href="" class="icons-header">
            <img src="../Img/icons/stock-svgrepo-com.svg" alt="">
            <span>Stock</span>
          </a>
        </li>
        {% if user.is_authenticated %}
        <li>
          <a href="" class="icons-header">
            <img src="../Img/icons/database-svgrepo-com.svg" alt="">
            <span>Gestion</span>
          </a>
        </li>
        {% endif %}
        <li>
          <a href="" class="icons-header">
            <img src="../Img/icons/config-svgrepo-com.svg" alt="">
            <span>Editar perfil</span>
          </a>
        </li>
 
        
      </ul>
      <div class="perfiluser">
        <span>Tontanza Valentina Wawa</span>
      </div>
    </nav>
  </div>
  <div class="layout">
    <main id="main">
      <p> {% block content %}

        {% endblock %}
      </p>

    </main>
  </div>
  





  <script src="../js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
