<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="../estilo/stylelogin.css">
</head>
<body>
  <div class="container">
    <h1>Crear cuenta</h1>
    <form action="#" method="post">
      <div class="input-box">
        <input type="text" placeholder="Nombre completo" name="nombre" required>
      </div>

      <div class="input-box">
        <input type="email" placeholder="Correo electrónico" name="email" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Contraseña" name="password" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Confirmar contraseña" name="confirmar" required>
      </div>

      <button type="submit" class="btn">Registrarse</button>

      <div class="remember-password">
        <label>
          <input type="checkbox" name="terminos" required>
          Acepto los términos y condiciones
        </label> <a href="TyC.html">Leer términos y condiciones</a>
      </div>

      <div class="register-link">
        ¿Ya tienes una cuenta?
        <a href="InicioSesionUsers.html">Inicia sesión</a>
      </div>
    </form>
  </div>
</body>
