<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="icon" type="image/png" href="../Img/logo.webp">
    <link rel="stylesheet" href="../estilo/stylelogin.css">
</head>
<body>
    <div class="container">
        <h1>Iniciar sesion</h1>
        <form action="">
            <div class="input-box">
                <input type="text" placeholder="Nombre de usuario" required>

            </div>
            <div class="input-box">
                <input type="password" placeholder="Contrasena" required>
                
            </div>
            <div class="remember-password">
                <label><input type="checkbox">Recordarme </label> 
                <a href="Recuperacion.html">Olvidaste tu contrasena?</a>
                 
            </div>

            <a href="../paginas/Index.html" class="btn"> Ingresar</a>

            <p class="register-link">Todavia no tienes una cuenta?<a href="RegistroUsers.html">Registrate</a></p>
        </form>
    </div>
    
</body>
</html>
