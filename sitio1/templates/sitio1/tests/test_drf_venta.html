<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test DRF Venta</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Prueba API DRF Venta</h2>

<div class="mb-3">
<label>JSON de prueba:</label>
<textarea id="jsonPayload" class="form-control" rows="8">{
  "productos": [
    { "id": 1, "cantidad": 2, "precio_unitario": 15000 }
  ],
  "medio_pago": "efectivo",
  "forzar": false
}</textarea>
</div>

<button id="btnEnviar" class="btn btn-primary">Enviar a API</button>

<h4 class="mt-4">Respuesta:</h4>
<pre id="respuesta" class="bg-light p-3"></pre>

<script>
document.getElementById("btnEnviar").addEventListener("click", async () => {
    const payload = document.getElementById("jsonPayload").value;
    
    let res = await fetch("/sitio1/api/drf/crear/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload
    });

    const data = await res.json();
    document.getElementById("respuesta").textContent = JSON.stringify(data, null, 2);
});
</script>

</body>
</html>
