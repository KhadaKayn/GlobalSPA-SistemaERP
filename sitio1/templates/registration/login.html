{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="icon" type="image/png" href="{% static 'Img/logo.webp' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'estilo/stylelogin.css' %}">
</head>
<body>
    <div class="container">
        <h1>Iniciar sesión</h1>
        
        <form method="POST" action="">
            {% csrf_token %}
            
            <!-- form |crispy Si usas el formulario Django (por ejemplo AuthenticationForm) -->
            {{ form  | crispy }} 
            
            <div class="remember-password">
                <label><input type="checkbox" name="remember"> Recordarme</label>
                <a href="{% url 'passsword_reset' %}">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn">Ingresar</button>

            <!-- <p class="register-link">
                ¿Todavía no tienes una cuenta?
                <a href="{% url 'registro' %}">Regístrate</a>
            </p>

            <p class="register-link">
                <a href="{% url 'home' %}">Volver al inicio</a>
            </p>-->
        </form>
    </div>
</body>
</html>
